<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinéMatch</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1>CinéMatch</h1>
      <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Rechercher un film..." aria-label="Rechercher un film">
        <button id="search-btn" class="search-btn" aria-label="Rechercher">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="search-clear" class="search-clear" aria-label="Effacer la recherche">&times;</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section id="favorites-section" class="favorites-section" hidden>
      <h2>Mes Favoris</h2>
      <div id="favorites-grid" class="movies-grid"></div>
    </section>

    <section class="catalog-section">
      <h2 id="section-title">Films Populaires</h2>
      <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Chargement en cours...</p>
      </div>
      <div id="error-message" class="error-message">
        <p>Une erreur est survenue lors du chargement des films.</p>
        <button id="retry-btn" class="primary-button">Réessayer</button>
      </div>
      <div id="movies-grid" class="movies-grid"></div>
    </section>
  </main>

  <dialog id="movie-modal" class="movie-modal">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Fermer">&times;</button>
      <div class="modal-body">
        <img id="modal-poster" class="modal-poster" src="" alt="">
        <div class="modal-info">
          <h2 id="modal-title"></h2>
          <p id="modal-date" class="modal-date"></p>
          <p id="modal-rating" class="modal-rating"></p>
          <p id="modal-genres" class="modal-genres"></p>
          <h3>Synopsis</h3>
          <p id="modal-overview" class="modal-overview"></p>
          <button id="modal-fav-btn" class="icon-button" aria-label="Ajouter aux favoris">
            <span class="heart-icon">&#9825;</span>
          </button>
        </div>
      </div>
      <div id="modal-trailer" class="modal-trailer" hidden></div>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
